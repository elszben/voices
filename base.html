<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hungarian voice test</title>
    <style>
        #sentences button {
            background: none;
            border: none;
            padding: 0.25em 0;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        #sentences button:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <p><select id="voiceSelect"></select></p>

    <ul id="sentences"></ul>

    <script>
        const sentences = [
            "Jó reggelt! Hogy vagy ma?",
            "Ma szép idő lesz! Nem fog esni az eső!",
        ];

        const synth = window.speechSynthesis;
        const select = document.getElementById("voiceSelect");
        const list = document.getElementById("sentences");

        function loadVoices() {
            const voices = synth.getVoices();
            const previous = select.value;

            select.innerHTML = "";

            voices.forEach(voice => {
                const option = document.createElement("option");

                option.value = voice.voiceURI;
                option.textContent =
                    `${voice.name} — ${voice.lang}` +
                    (voice.localService ? " [local]" : " [remote]");

                select.appendChild(option);
            });

            if (voices.some(v => v.voiceURI === previous)) {
                select.value = previous;
            } else {
                const hungarian = voices.find(v =>
                    v.lang.toLowerCase().startsWith("hu")
                );
                if (hungarian) {
                    select.value = hungarian.voiceURI;
                }
            }

            console.table(
                voices.map(v => ({
                    name: v.name,
                    lang: v.lang,
                    local: v.localService,
                    uri: v.voiceURI
                }))
            );
        }

        sentences.forEach(sentence => {
            const item = document.createElement("li");
            const button = document.createElement("button");

            button.textContent = sentence;
            button.disabled = !synth;
            button.addEventListener("click", () => speak(sentence));

            item.appendChild(button);
            list.appendChild(item);
        });

        if (synth) {
            loadVoices();

            if ("onvoiceschanged" in synth) {
                synth.onvoiceschanged = loadVoices;
            }
        } else {
            list.insertAdjacentHTML(
                "beforebegin",
                "<p>This browser does not support speech synthesis.</p>"
            );
        }

        function speak(text) {
            const voice = synth.getVoices().find(v =>
                v.voiceURI === select.value
            );

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.lang = "hu-HU";
            if (voice) {
                utterance.voice = voice;
            }
            utterance.rate = 0.9;

            console.log("Selected voice:", voice);

            synth.cancel();
            synth.speak(utterance);
        }
    </script>

</body>

</html>
